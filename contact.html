<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Blue Earl Technologies</title>
    <link rel="stylesheet" href="index.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .contact-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; padding: 120px 5% 80px; }
        .contact-info h1 { font-size: 3rem; margin-bottom: 2rem; }
        .contact-form { background: var(--pure-white); padding: 3rem; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--light-gray); border-radius: 4px; }
        @media (max-width: 768px) { .contact-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="contact-wrapper">
        <div class="contact-info">
            <h1>Let's Build the <br> Future Together.</h1>
            <p style="margin-bottom: 2rem; color: var(--slate-gray);">Have a project in mind or want to learn more about our industry solutions? Our architects are ready to help.</p>
            <div style="display: flex; flex-direction: column; gap: 1rem;">
                <p><i data-lucide="mail" style="color: var(--cerulean-blue); vertical-align: middle; margin-right: 10px;"></i> hello@blueearl.tech</p>
                <p><i data-lucide="map-pin" style="color: var(--cerulean-blue); vertical-align: middle; margin-right: 10px;"></i> Global Operations</p>
            </div>
        </div>

        <form class="contact-form" id="mainContactForm">
            <div class="form-row">
                <div>
                    <label>First Name</label>
                    <input type="text" required>
                </div>
                <div>
                    <label>Last Name</label>
                    <input type="text" required>
                </div>
            </div>
            <div style="margin-bottom: 1rem;">
                <label>Industry</label>
                <select id="industryDropdown">
                    <option value="healthcare">Healthcare & Insurance</option>
                    <option value="manufacturing">Manufacturing</option>
                    <option value="education">Private Education</option>
                    <option value="logistics">Logistics & Distribution</option>
                    <option value="realestate">Real Estate</option>
                </select>
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label>Message</label>
                <textarea rows="4" placeholder="How can we help?"></textarea>
            </div>
            <button type="submit" class="btn-main" style="width: 100%;">Send Inquiry</button>
        </form>
    </div>

    <script src="index.js"></script>
    <script>
        // Pre-fill industry from URL if present
        window.addEventListener('load', () => {
            const params = new URLSearchParams(window.location.search);
            const industry = params.get('industry');
            if (industry) {
                document.getElementById('industryDropdown').value = industry;
            }
        });
    </script>
</body>
</html>
